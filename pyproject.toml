[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facelock"
version = "1.1.0"
description = "A lightweight developer API to interact with the FaceLock biometric daemon."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Subrata Saha" }
]

[tool.setuptools]
packages = ["facelock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
